<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mech Shooter</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #start-overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.75rem;
      background: rgba(0,0,0,0.75); color: #fff;
      font-family: sans-serif; cursor: pointer;
      z-index: 10; text-align: center;
    }
    #start-overlay .start-title { font-size: 1.8rem; font-weight: bold; }
    #start-overlay .start-controls { font-size: 1rem; color: #bcd; line-height: 1.6; }
    #start-overlay .start-controls b { color: #fff; }
  </style>
</head>
<body>
  <div id="start-overlay">
    <div class="start-title">Click to start</div>
    <div class="start-controls">
      <b>W A S D</b> move &nbsp;&middot;&nbsp; <b>Mouse</b> look/aim &nbsp;&middot;&nbsp; <b>Left click (hold)</b> fire<br>
      The match begins the moment you click — you'll be in the fight immediately.
    </div>
  </div>
  <canvas id="game-canvas"></canvas>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "postprocessing": "https://unpkg.com/postprocessing@6.36.6/build/index.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
